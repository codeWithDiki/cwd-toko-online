server {
    listen 80;
    server_name _;

    # Resolver for dynamic upstream lookup (deferred to request time, not startup).
    # Auto-detected from /etc/resolv.conf by entrypoint — override via NGINX_RESOLVER.
    resolver ${NGINX_RESOLVER} valid=30s ipv6=off;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 100M;
    fastcgi_read_timeout 120s;

    # Let's Encrypt ACME challenge — needed to obtain first certificate
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check — returns 200 immediately without hitting PHP-FPM.
    # Use this as the liveness/readiness probe endpoint in Helipod / K8s.
    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Reverb WebSocket
    location ~ ^/(app|apps)/ {
        set $reverb_upstream "${NGINX_REVERB_HOST}:${NGINX_REVERB_PORT}";
        proxy_pass http://$reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ~* \.(css|js|woff2?|ttf|otf|eot|svg|ico|png|jpg|jpeg|gif|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri /index.php?$query_string;
    }

    location /storage/ {
        alias /var/www/html/storage/app/public/;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $fpm_upstream "${NGINX_APP_HOST}:9000";
        fastcgi_pass $fpm_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "upload_max_filesize=100M \n post_max_size=100M";
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
