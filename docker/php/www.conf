[www]
; Listen on all interfaces so nginx can reach PHP-FPM from a separate pod/container.
; Default is 127.0.0.1:9000 (loopback only) which breaks cross-pod communication
; in Kubernetes / Helipod where each service runs in its own pod.
listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
