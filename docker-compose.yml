secrets:
  # auth.json must exist locally — generate with:
  #   composer config bearer.dikiakbarasyidiq.dev <license_key>
  # Format:
  # {
  #   "bearer": {
  #     "dikiakbarasyidiq.dev": "<license_key>"
  #   }
  # }
  composer_auth:
    file: ./auth.json

services:

  # ---------------------------------------------------------------------------
  # Redis — sessions, cache, queues
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # App — PHP-FPM (handles all HTTP via Nginx → FastCGI)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      target: runtime
      secrets:
        - composer_auth
      args:
        # Reverb is proxied by Nginx on port 80, so browser connects to same host/port
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-laravel-herd}
        VITE_REVERB_HOST: ${APP_DOMAIN:-localhost}
        VITE_REVERB_PORT: "80"
        VITE_REVERB_SCHEME: "http"
    env_file: .env
    environment:
      CONTAINER_ROLE: app
      # Override Redis host to the service name
      REDIS_HOST: redis
      # Reverb external coordinates (what the browser/pusher client sees)
      REVERB_HOST: ${APP_DOMAIN:-localhost}
      REVERB_PORT: "80"
      REVERB_SCHEME: http
    volumes:
      # Persist SQLite database and storage across restarts
      - app_database:/var/www/html/database
      - app_storage:/var/www/html/storage
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Nginx — web server, static files, proxies PHP-FPM and Reverb WS
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: .
      target: webserver
      secrets:
        - composer_auth
    ports:
      - "80:80"
    volumes:
      # Serve uploaded files from the same storage volume as the app
      - app_storage:/var/www/html/storage:ro
    depends_on:
      - app
      - reverb
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Horizon — processes queued jobs (Redis)
  # ---------------------------------------------------------------------------
  horizon:
    build:
      context: .
      target: runtime
      secrets:
        - composer_auth
    env_file: .env
    environment:
      CONTAINER_ROLE: horizon
      REDIS_HOST: redis
    volumes:
      - app_database:/var/www/html/database
      - app_storage:/var/www/html/storage
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Reverb — Laravel WebSocket server
  # ---------------------------------------------------------------------------
  reverb:
    build:
      context: .
      target: runtime
      secrets:
        - composer_auth
    env_file: .env
    environment:
      CONTAINER_ROLE: reverb
      REDIS_HOST: redis
      # Bind to all interfaces inside the container
      REVERB_SERVER_HOST: "0.0.0.0"
      REVERB_SERVER_PORT: "8080"
      # External coordinates must match the Host header Nginx forwards
      REVERB_HOST: ${APP_DOMAIN:-localhost}
      REVERB_PORT: "80"
      REVERB_SCHEME: http
    volumes:
      - app_database:/var/www/html/database
      - app_storage:/var/www/html/storage
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:
  app_database:
  app_storage:
