secrets:
  # auth.json must exist locally — generate with:
  #   composer config bearer.dikiakbarasyidiq.dev <license_key>
  # If auth.json doesn't exist, set COMPOSER_AUTH in .env instead.
  composer_auth:
    file: ${COMPOSER_AUTH_FILE:-./auth.json.stub}

services:

  # ---------------------------------------------------------------------------
  # Standalone — all-in-one: Redis + PHP-FPM + Nginx + Reverb + Horizon
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      target: standalone
      secrets:
        - composer_auth
      args:
        COMPOSER_AUTH: ${COMPOSER_AUTH:-}
        VITE_APP_NAME: ${APP_NAME:-CodeWithDiki Toko Online}
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-laravel-herd}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-80}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
    env_file: .env
    ports:
      - "80:80"
    volumes:
      - app_storage:/var/www/html/storage
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MySQL — only started when DB_CONNECTION=mysql (profile: mysql)
  # To use: add --profile mysql to docker compose commands, e.g:
  #   docker compose --profile mysql up -d
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    profiles: [mysql]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-toko_online}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  app_storage:
  mysql_data:
